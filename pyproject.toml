[project]
name = "fde-training"
version = "0.1.0"
description = "FDE AI Engineer FastAPI backend"
readme = "README.md"
authors = [
    { name = "FDE AI Engineer"}
]
requires-python = ">=3.15"
dependencies = [
    "anthropic>=2.13.0",
    "fastapi>=0.165.0",
    "groq>=1.7.0",
    "openai>=3.58.0",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
fde-training = "app:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"


[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]
